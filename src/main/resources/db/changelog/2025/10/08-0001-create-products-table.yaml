databaseChangeLog:
  - changeSet:
      id: create-products-table
      author: svifty7
      changes:
        - createTable:
            tableName: products
            schemaName: rudagames
            columns:
              - column:
                  name: id
                  type: integer
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
                  constraints:
                    nullable: true
              - column:
                  name: link
                  type: varchar(255)
                  constraints:
                    nullable: true

        - sqlFile:
            dbms: postgresql
            path: sql/insert-products.sql
            relativeToChangelogFile: true
            splitStatements: true
            stripComments: true

        - dropColumn:
            tableName: events
            schemaName: rudagames
            columnName: product

        - addColumn:
            tableName: events
            schemaName: rudagames
            columns:
              - column:
                  name: product_id
                  type: integer
                  constraints:
                    nullable: false
                    unique: true

        - addForeignKeyConstraint:
            baseTableName: events
            baseColumnNames: product_id
            constraintName: fk_events_product_id
            referencedTableName: products
            referencedColumnNames: id
            baseTableSchemaName: rudagames
            referencedTableSchemaName: rudagames
            deferrable: false
            initiallyDeferred: false
            onDelete: CASCADE
