databaseChangeLog:
  - changeSet:
      id: init-rudagames-events
      author: svifty7
      changes:
        - createTable:
            tableName: events
            schemaName: rudagames
            columns:
              - column:
                  name: uuid
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
                    unique: true
              - column:
                  name: name
                  type: tinytext
                  constraints:
                    nullable: false
              - column:
                  name: play_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: registration_start_at
                  type: timestamp
                  constraints:
                    nullable: false
              - column:
                  name: product
                  type: tinytext
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: text
              - column:
                  name: tour_count
                  type: integer
              - column:
                  name: max_players_in_team
                  type: integer
              - column:
                  name: min_players_in_team
                  type: integer
              - column:
                  name: is_registration_opened
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: is_full
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: tag
                  type: tinytext
              - column:
                  name: image_url
                  type: text
              - column:
                  name: max_team_count
                  type: integer
              - column:
                  name: current_team_count
                  type: integer
              - column:
                  name: type
                  type: tinytext
